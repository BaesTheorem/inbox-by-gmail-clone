<!doctype html>
<!-- Nothing here may be pressed: the opt-out wording sits in a heading with no pointer
     cursor and in a checkbox label, where a click would untick the box. -->
<html><body>
<h2>Unsubscribe</h2>
<label style="cursor:pointer"><input type="checkbox" id="box" name="optout" value="unsubscribe_all">
  <span>Unsubscribe from all email</span></label>
<div style="cursor:pointer">Read our story about how we started this small company</div>
</body></html>
